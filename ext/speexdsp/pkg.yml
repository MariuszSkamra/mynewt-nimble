pkg.name: ext/speexdsp
pkg.description: >
    Fixed point resampler from SpeexDSP. Users include
    speex/speex_resampler.h with OUTSIDE_SPEEX and RANDOM_PREFIX
    defined as in app.cflags.
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "http://mynewt.apache.org/"
pkg.keywords:
    - speexdsp
    - resampler

pkg.type: sdk

pkg.cflags: -O3 -DOUTSIDE_SPEEX -DFIXED_POINT -DRANDOM_PREFIX=nimble_speex -DEXPORT=
pkg.lflags: -lm

app.cflags:
    - -DOUTSIDE_SPEEX
    - -DRANDOM_PREFIX=nimble_speex

pkg.source_files:
    - "@speexdsp/libspeexdsp/resample.c"

pkg.include_dirs:
    - "@speexdsp/include"

pkg.private_include_dirs:
    - "@speexdsp/include/speex"

repository.speexdsp:
    type: git
    vers: 4f26bbd6a4bba7190d76c452ab9083844eff837b-commit
    url: https://gitlab.xiph.org/xiph/speexdsp.git
